version: '3.9'

services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    ports:
      - '7880:7880' # HTTP API / WSS
      - '7881:7881' # TCP WebRTC
      - '50000-50050:50000-50050/udp' # UDP WebRTC
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - '1935:1935'
      - '8888:8888'
      - '9997:9997'
    environment:
      # - MTX_WEBRTC=yes
      # - MTX_PATHS_ALL_OTHERS_RECORD=no
      # - MTX_READTIMEOUT=10s
      - MTX_DUMMY_VAR=1
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
      - ./recordings:/recordings

  nats:
    image: nats:latest
    ports:
      - '4222:4222'
      - '8222:8222'
      - '9222:9222'
    volumes:
      - ./nats.conf:/etc/nats/nats.conf
    command: '-c /etc/nats/nats.conf'
